<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>AKAN NAME GENERATOR.</h1>

    <p>
        Akan names are given according to the day of the week a person is born.
        Enter your birthday and gender to discover your Akan.
    </p>

    <form id="akanForm">

        <label>Day</label>
        <input type="number" id="day" min="1" max="31">

        <label>Month</label>
        <input type="number" id="month" min="1" max="12">

        <label>Year</label>
        <input type="number" id="year">

        <label>Gender</label>

        <div class="gender">
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </div>

        <button type="submit">Generate Akan Name</button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
